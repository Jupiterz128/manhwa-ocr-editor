<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manhwa OCR Editor 4.0</title>
<link rel="stylesheet" href="tailwind.css"><link rel="stylesheet" href="studio.css">
<header class="flex items-center"><b class="brand"><i>▤</i> Manhwa OCR Editor <small>4.0</small></b><span id="projectName">ยังไม่มีโปรเจกต์</span><button id="open">เปิดโปรเจกต์</button><button id="create">＋ สร้าง</button><nav id="modes"></nav><button class="cmd-btn" data-cmd="palette">⌘ คำสั่ง… <kbd>Ctrl K</kbd></button><button class="btn-txt" data-cmd="txtModal" title="ส่งออก / นำเข้าคำแปล TXT (T)">📄 ส่งออก TXT <kbd>T</kbd></button><button class="primary" data-cmd="export">Export PSD</button><button data-cmd="left" title="แถบซ้าย [">◧</button><button data-cmd="right" title="แถบขวา ]">◨</button></header>
<main><aside id="left"><section><h2>หน้าการ์ตูน</h2><div id="pages"></div></section><section class="flex-grow"><div class="sec-head"><h2>Bubbles / Layers</h2><button class="mini btn-add-frame" data-cmd="addFrame" title="วาดกรอบบอลลูนใหม่ (N)">+ กรอบ</button></div><div id="layers"></div></section><footer><i class="dot ready"></i><span>Photopea Backend</span><small class="ver-tag">v4.0</small></footer></aside>
<article><div id="viewport"><div id="stage"><img id="art" draggable="false" alt=""><div id="overlay"></div><canvas id="paint"></canvas></div></div><div id="topBar" class="float top"><div id="views"></div><span class="sep"></span><div id="legend"><span><i class="dot st-low"></i>OCR&lt;90%</span><span><i class="dot st-untranslated"></i>รอแปล</span><span><i class="dot st-ready"></i>แปลแล้ว</span><span><i class="dot st-selected"></i>เลือกอยู่</span></div></div><div id="empty"><i>▤</i><h1>เปิดหน้าการ์ตูน</h1><p>เลือกไฟล์ภาพหรือโปรเจกต์ .mtp เพื่อเริ่มแก้ไข</p><button class="primary" id="pick">เลือกไฟล์</button></div><div class="float tools"><button class="t-move" data-cmd="move" title="ย้าย / ย่อขยาย 8 มุม (V)">Move <kbd>V</kbd></button><button class="t-add" data-cmd="addFrame" title="วาดกรอบใหม่บนภาพ (N)">+ กรอบ <kbd>N</kbd></button><button class="t-del" data-cmd="deleteFrame" title="ลบกรอบที่เลือก (Del)">ลบ <kbd>Del</kbd></button><button class="t-rapid" data-cmd="rapidBubble" title="อ่านข้อความเฉพาะกรอบที่เลือกด้วย RapidOCR">⚡ RapidOCR ช่องนี้</button><button class="t-mask" data-cmd="maskEdit" title="แก้ Mask รายช่องหลัง Clean (M)">แก้ Mask <kbd>M</kbd></button><span class="sep"></span><button data-zoom=".83" title="ซูมออก">−</button><button id="percent" title="100%">100%</button><button data-zoom="1.2" title="ซูมเข้า">＋</button><button data-cmd="fit" title="พอดีหน้าจอ">Fit</button><span class="sep"></span><button class="t-gemini" data-cmd="gemini" title="แปลทั้งหน้าด้วย Gemini">✧ Gemini แปลทั้งหน้า</button></div></article>
<aside id="right"><div id="cleanPanel" hidden><div class="meta"><h3>แก้ Mask รายช่อง</h3><small id="maskTarget"></small></div><div class="row"><button id="brush">+ ระบายเพิ่ม</button><button id="eraser">- ลบ Mask</button><button data-cmd="maskUndo">Undo</button></div><label>ขนาดพู่กัน <output id="radiusValue">12</output> px<input id="radius" type="range" min="1" max="80" value="12"></label><button id="maskToggle" hidden>สลับดู Mask / Preview</button><div class="row mask-actions"><button data-cmd="maskPreview">Preview</button><button class="primary" data-cmd="maskApply">ตกลง</button><button data-cmd="maskCancel">ยกเลิก</button></div></div><h2>Inspector</h2><div id="inspector"></div></aside></main>
<div id="notice" role="status"></div><dialog id="dialog"><button id="close" aria-label="ปิด">×</button><div id="modal"></div></dialog><input hidden id="files" type="file" multiple accept="image/*,.mtp"><input hidden id="txtFile" type="file" accept=".txt,text/plain">
<template id="fields"><div class="meta insp-head"><div class="insp-id"><strong id="bid"></strong><span id="frameBadge" class="type-pill"></span></div><div class="insp-right"><small id="score"></small><button class="icon-danger" data-cmd="deleteFrame" title="ลบกรอบนี้ (Del)">🗑</button></div></div><label>ประเภทกรอบ<select id="frame"></select></label><div class="field-head"><span>ต้นฉบับ</span><button class="mini btn-rapid" data-cmd="rapidBubble" title="อ่านข้อความเฉพาะกรอบนี้ด้วย RapidOCR">⚡ RapidOCR ช่องนี้</button></div><textarea id="source" rows="2"></textarea><label>คำแปลไทย<textarea id="thai" rows="4"></textarea></label><button class="btn-gemini" data-cmd="polish">✧ เกลาสำนวนด้วย Gemini</button><h3>Typography</h3><label>ฟอนต์<select id="font"></select></label><div class="row"><label>สี<input id="ink" type="color"></label><label>หมุน °<input id="rotation" type="number" min="-180" max="180"></label><label>จัดชิด<select id="align"><option value="left">ซ้าย</option><option value="center">กลาง</option><option value="right">ขวา</option></select></label></div><label>ขนาด <output id="sizeValue"></output> px<input id="size" type="range" min="6" max="220"></label><small>Auto Leading · 120%</small><h3>Layer Style <i>fx</i></h3><div class="row"><label><input type="checkbox" id="stroke"> Stroke</label><input id="edge" type="color"><input id="width" type="number" min="1" max="8"></div><label><input type="checkbox" id="gradient"> Gradient Overlay</label><div class="row"><input id="start" type="color"><span>→</span><input id="end" type="color"><select id="angle"><option value="90">90° แนวตั้ง</option><option value="0">0° แนวนอน</option></select></div><div class="row"><button data-cmd="fx">ดูดสี Auto</button><button data-cmd="reset">ล้าง fx</button></div></template>
<script src="studio.js" defer></script></html>
