<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manhwa OCR Editor 4.0</title>
<link rel="stylesheet" href="tailwind.css"><link rel="stylesheet" href="studio.css">
<header class="flex items-center"><b class="brand"><i>▤</i> Manhwa OCR Editor <small>4.0</small></b><span id="projectName">ยังไม่มีโปรเจกต์</span><button id="open">เปิดโปรเจกต์</button><button id="create">＋ สร้าง</button><nav id="modes"></nav><button class="cmd-btn" data-cmd="palette">⌘ คำสั่ง… <kbd>Ctrl K</kbd></button><button class="btn-txt" data-cmd="txtModal" title="ส่งออก / นำเข้าคำแปล TXT (T)">📄 ส่งออก TXT <kbd>T</kbd></button><button class="primary" data-cmd="export">Export PSD</button><button data-cmd="left" title="แถบซ้าย [">◧</button><button data-cmd="right" title="แถบขวา ]">◨</button></header>
<main><aside id="left"><section class="pages-sec"><h2>หน้าการ์ตูน</h2><div id="pages"></div></section><section class="layers-sec flex-grow"><div class="sec-head"><h2>Bubbles / Layers</h2><button class="mini btn-add-frame" data-cmd="addFrame" title="วาดกรอบบอลลูนใหม่ (N)">+ กรอบ</button></div><div id="layers"></div></section><section id="profilePanel"><h2>ฟอนต์ตามโปรไฟล์</h2><select id="presetSelect" aria-label="เลือกโปรไฟล์ฟอนต์"></select><select id="presetScope" aria-label="ขอบเขตการจัดฟอนต์"><option value="all">ทั้งโปรเจกต์</option><option value="page">หน้าปัจจุบัน</option></select><button class="primary profile-apply" data-cmd="applyPreset" title="จัดฟอนต์และกึ่งกลางบับเบิ้ลตามโปรไฟล์ที่เลือก">จัดฟอนต์ตามโปรไฟล์</button><div class="row profile-btns"><button class="mini" data-cmd="editPreset">ตั้งค่าฟอนต์</button><button class="mini btn-add-frame" data-cmd="newPreset">+ เพิ่มโปรไฟล์</button></div></section><footer><i class="dot ready"></i><span>Photopea Backend</span><small class="ver-tag">v4.0</small></footer></aside>
<article><div id="viewport"><div id="stage"><img id="art" draggable="false" alt=""><img id="artOrig" draggable="false" alt=""><div id="overlay"></div><canvas id="paint"></canvas></div></div><div id="topBar" class="float top"><div id="views"></div><span class="sep"></span><div id="legend"><span><i class="dot st-low"></i>OCR&lt;90%</span><span><i class="dot st-untranslated"></i>รอแปล</span><span><i class="dot st-ready"></i>แปลแล้ว</span><span><i class="dot st-selected"></i>เลือกอยู่</span></div></div><div id="empty"><i>▤</i><h1>เปิดหน้าการ์ตูน</h1><p>เลือกไฟล์ภาพ, โปรเจกต์ .mtp หรือ .json เพื่อเริ่มแก้ไข</p><button class="primary" id="pick">เลือกไฟล์</button></div><div class="float tools"><button class="t-move" data-cmd="move" title="ย้าย / ย่อขยาย 8 มุม (V)">Move <kbd>V</kbd></button><button class="t-add" data-cmd="addFrame" title="วาดกรอบใหม่บนภาพ (N)">+ กรอบ <kbd>N</kbd></button><button class="t-del" data-cmd="deleteFrame" title="ลบกรอบที่เลือก (Del)">ลบ <kbd>Del</kbd></button><button class="t-rapid" data-cmd="rapidBubble" title="อ่านข้อความเฉพาะกรอบที่เลือกด้วย RapidOCR">⚡ RapidOCR ช่องนี้</button><button class="t-mask" data-cmd="maskEdit" title="แก้ Mask รายช่องหลัง Clean (M)">แก้ Mask <kbd>M</kbd></button><span class="sep"></span><button data-zoom=".83" title="ซูมออก">−</button><button id="percent" title="100%">100%</button><button data-zoom="1.2" title="ซูมเข้า">＋</button><button id="compareBtn" class="t-compare" data-cmd="compareOriginal" data-state="off" aria-pressed="false" aria-label="ดูเทียบภาพต้นฉบับ + Text" title="เปิดตา: ดูเทียบ Text กับภาพต้นฉบับ (กด 0 เพื่อ Fit)"><svg class="ic-eye" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="ic-eye-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg></button><span class="sep"></span><button class="t-gemini" data-cmd="gemini" title="แปลทั้งหน้าด้วย Gemini">✧ Gemini แปลทั้งหน้า</button></div></article>
<aside id="right"><div id="maskOptions" hidden><small id="maskTarget"></small><details><summary>ตัวเลือกมาสก์และการซ่อม</summary><label>Margin <input id="maskMargin" type="number" value="6" min="0" max="96"></label><label>Grow <input id="maskGrow" type="number" value="6" min="0" max="32"></label><button data-cmd="rebuild">สร้างร่างใหม่</button><label>วิธีคลีน<select id="maskMethod"><option>auto</option><option>lama</option><option>solid</option><option>gradient</option><option>inpaint</option></select></label><label>สีพื้นสำหรับ solid <input id="solidColor" type="color" value="#ffffff"></label><button data-cmd="pipette">ดูดสีพื้นจากภาพ</button></details></div><h2>Inspector</h2><div id="inspector"></div></aside><div id="cleanPanel" role="toolbar" aria-label="แก้ Mask รายช่อง" inert><button type="button" id="maskGrip" aria-label="ลากแถบเครื่องมือ Mask" title="ลากย้ายแถบเครื่องมือ">⋮⋮</button><button id="brush">+ ระบายเพิ่ม</button><button id="eraser">- ลบ Mask</button><label class="brush-size">ขนาดพู่กัน <input id="radius" type="range" min="1" max="80" value="12"><span><output id="radiusValue">12</output> px</span></label><button data-cmd="maskUndo">Undo</button><button id="maskToggle" hidden>สลับดู Mask / Preview</button><button data-cmd="maskPreview">Preview</button><button class="primary" data-cmd="maskApply">ตกลง</button><button data-cmd="maskCancel">ยกเลิก</button></div><div id="textBar" role="toolbar" aria-label="แถบปรับข้อความ" inert><button type="button" id="textBarGrip" aria-label="ลากแถบปรับข้อความ" title="ลากย้ายแถบเครื่องมือ">⋮⋮</button><select id="tbFont" aria-label="ฟอนต์" title="ฟอนต์"></select><input id="tbColor" type="color" aria-label="สีตัวอักษร" title="สีตัวอักษร"><div id="tbAlign" class="tb-align" role="group" aria-label="จัดชิดข้อความ"><button type="button" data-tb-align="left" title="จัดชิดซ้าย" aria-label="จัดชิดซ้าย"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 7h8M2 10.5h11M2 14h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><button type="button" data-tb-align="center" title="จัดกึ่งกลาง" aria-label="จัดกึ่งกลาง"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4 7h8M2.5 10.5h11M4.5 14h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><button type="button" data-tb-align="right" title="จัดชิดขวา" aria-label="จัดชิดขวา"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M6 7h8M3 10.5h11M7 14h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div><div class="tb-size" aria-label="ขนาดฟอนต์"><button type="button" id="tbSizeDec" title="ลดขนาดฟอนต์" aria-label="ลดขนาดฟอนต์">−</button><input id="tbSize" type="number" min="6" max="220" step="1" aria-label="ขนาดฟอนต์ (px)" title="ขนาดฟอนต์ (px)"><span class="tb-unit">px</span><button type="button" id="tbSizeInc" title="เพิ่มขนาดฟอนต์" aria-label="เพิ่มขนาดฟอนต์">+</button></div></div></main>
<div id="notice" role="status"></div><dialog id="dialog"><button id="close" aria-label="ปิด">×</button><div id="modal"></div></dialog><input hidden id="files" type="file" multiple accept="image/*,.mtp,.json"><input hidden id="txtFile" type="file" accept=".txt,text/plain">
<template id="fields"><div class="meta insp-head"><div class="insp-id"><strong id="bid"></strong><span id="frameBadge" class="type-pill"></span></div><div class="insp-right"><small id="score"></small><button class="icon-danger" data-cmd="deleteFrame" title="ลบกรอบนี้ (Del)">🗑</button></div></div><div id="coordInfo" class="coord-bar"></div><label>ประเภทกรอบ<select id="frame"></select></label><div class="field-head"><span>ต้นฉบับ</span><button class="mini btn-rapid" data-cmd="rapidBubble" title="อ่านข้อความเฉพาะกรอบนี้ด้วย RapidOCR">⚡ RapidOCR ช่องนี้</button></div><textarea id="source" rows="2"></textarea><label>คำแปลไทย<textarea id="thai" rows="4"></textarea></label><button class="btn-gemini" data-cmd="polish">✧ เกลาสำนวนด้วย Gemini</button><h3>Typography</h3><label>ฟอนต์<select id="font"></select></label><button id="pageFont">เปลี่ยนฟอนต์ทั้งหน้า</button><div class="row"><label>สี<input id="ink" type="color"></label><label>หมุน °<input id="rotation" type="number" min="-180" max="180"></label><label>จัดชิด<select id="align"><option value="left">ซ้าย</option><option value="center">กลาง</option><option value="right">ขวา</option></select></label></div><label>ขนาด <output id="sizeValue"></output> px<input id="size" type="range" min="6" max="220"></label><small>Auto Leading · 120%</small><h3>Layer Style <i>fx</i></h3><div class="row"><label><input type="checkbox" id="stroke"> Stroke</label><input id="edge" type="color"><input id="width" type="number" min="1" max="8"></div><label><input type="checkbox" id="gradient"> Gradient Overlay</label><div class="row"><input id="start" type="color"><span>→</span><input id="end" type="color"><select id="angle"><option value="90">90° แนวตั้ง</option><option value="45">45° ทแยง</option><option value="135">135° ทแยง</option><option value="0">0° แนวนอน</option></select></div><div class="row"><button data-cmd="fx">ดูดสี Auto</button><button data-cmd="reset">ล้าง fx</button></div></template>
<script src="studio.js" defer></script></html>
