name: Manhwa OCR to Photoshop
on:
  workflow_dispatch:
    inputs:
      input_mode:
        description: 'ประเภทต้นทางใน Google Drive'
        required: true
        type: choice
        default: image_folder
        options: [mtp, image_folder]
      drive_link:
        description: 'ลิงก์ไฟล์ MTP หรือโฟลเดอร์ภาพ'
        type: string
        required: true
      ocr_lang:
        description: 'ภาษา OCR ของโฟลเดอร์ภาพ'
        type: choice
        default: ko+en
        options: [ko+en, en, zh+en, zh_tw+en]
      translation_mode:
        description: 'โหมดแปลข้อความ (manual_drive = ส่ง 01_raw_text.txt ขึ้น Drive + แจ้ง Discord + รอ 02_translated.txt | gemini_auto = แปลอัตโนมัติด้วย Gemini)'
        type: choice
        default: manual_drive
        options: [manual_drive, gemini_auto]
      wait_timeout_minutes:
        description: 'เวลารอไฟล์ 02_translated.txt บน Drive (นาที, ใส่ 0 = ไม่รอ จบทันทีหลังอัปโหลด 01_raw_text.txt)'
        type: number
        default: 60
      translation_drive_link:
        description: 'ลิงก์ไฟล์ TXT ที่แปลแล้ว (ทางเลือกเสริม: เว้นว่างเพื่อใช้โหมด translation_mode ด้านบน)'
        type: string
        default: ''
      translation_note:
        description: 'คำแนะนำการแปล เช่น แนวเรื่อง สรรพนาม หรือชื่อตัวละครเฉพาะ'
        type: string
        required: false
        default: ''
      auto_stroke:
        description: 'ดูดสีเส้นขอบตัวอักษร'
        type: boolean
        default: false
      auto_gradient:
        description: 'ดูดสีไล่ระดับตัวอักษร'
        type: boolean
        default: false
      export_format:
        description: 'ไฟล์ผลลัพธ์บน Drive (all = PSD ทุกหน้าและโปรเจกต์ MTP)'
        type: choice
        default: psd
        options: [psd, mtp, all]
      psd_backend:
        description: 'ตัวส่งออก PSD (photopea ไม่เปิด Adobe Photoshop)'
        type: choice
        default: photopea
        options: [photopea, photoshop]
      font_preset_override:
        description: 'โปรไฟล์ฟอนต์ (auto เลือกการ์ตูนต่อสู้สำหรับ MTP)'
        type: choice
        default: auto
        options: [auto, '1. มังฮวาเกาหลี', '2. การ์ตูนต่อสู้']
      use_smart_stitch:
        description: 'รวมและตัดหน้าเมื่อรับคำแปลกลับ (MTP เปิดอัตโนมัติ)'
        type: boolean
        default: false

permissions: {}
concurrency:
  group: local-rtx4060-runner
  cancel-in-progress: false
  queue: max
jobs:
  convert:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, manhwa-rtx4060]
    steps:
      - name: Update local repository (git pull)
        shell: powershell
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          if (Test-Path "$env:ProgramFiles\Git\cmd") {
            $env:PATH = "$env:ProgramFiles\Git\cmd;$env:PATH"
          }
          $root = $env:MANHWA_APP_HOME
          if (!$root) { $root = 'D:\ManhwaOCR' }
          Set-Location -LiteralPath $root
          git pull --rebase --autostash origin main
          exit $LASTEXITCODE
      - name: Run local pipeline
        shell: powershell
        env:
          MODE: ${{ inputs.input_mode }}
          SOURCE: ${{ inputs.drive_link }}
          TRANSLATION: ${{ inputs.translation_drive_link }}
          TRANSLATION_MODE: ${{ inputs.translation_mode }}
          WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
          TRANSLATION_NOTE: ${{ inputs.translation_note }}
          AUTO_STROKE: ${{ inputs.auto_stroke }}
          AUTO_GRADIENT: ${{ inputs.auto_gradient }}
          EXPORT_FORMAT: ${{ inputs.export_format }}
          PSD_BACKEND: ${{ inputs.psd_backend }}
          PRESET: ${{ inputs.font_preset_override }}
          OCR_LANG: ${{ inputs.ocr_lang }}
          STITCH: ${{ inputs.use_smart_stitch }}
          GH_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          if ($env:GH_GEMINI_API_KEY) { $env:GEMINI_API_KEY = $env:GH_GEMINI_API_KEY }
          $root = $env:MANHWA_APP_HOME
          if (!$root) { $root = 'D:\ManhwaOCR' }
          Set-Location -LiteralPath $root
          $params = @('-X','utf8','cli_pipeline.py','--input-mode',$env:MODE,'--drive-link',$env:SOURCE,'--lang',$env:OCR_LANG,'--smart-stitch',$env:STITCH,'--psd-backend',$env:PSD_BACKEND,'--export-format',$env:EXPORT_FORMAT)
          if ($env:AUTO_STROKE -eq 'true') { $params += '--auto-stroke' }
          if ($env:AUTO_GRADIENT -eq 'true') { $params += '--auto-gradient' }
          if (![string]::IsNullOrWhiteSpace($env:TRANSLATION_NOTE)) { $params += @("--translation-note=$env:TRANSLATION_NOTE") }
          if ($env:PRESET -ne 'auto') { $params += @('--preset',$env:PRESET) }
          if ($env:MODE -eq 'image_folder') {
            if ($env:TRANSLATION_MODE) { $params += @('--translation-mode',$env:TRANSLATION_MODE) }
            if ($env:WAIT_TIMEOUT_MINUTES -ne $null -and $env:WAIT_TIMEOUT_MINUTES -ne '') {
              $params += @('--wait-timeout-minutes',$env:WAIT_TIMEOUT_MINUTES)
            }
          }
          if ($env:TRANSLATION) {
            $params += @('--translation-link',$env:TRANSLATION)
          } elseif ($env:MODE -eq 'image_folder' -and $env:TRANSLATION_MODE -eq 'gemini_auto') {
            $params += @('--auto-translate-gemini')
          }
          & (Join-Path $root '.venv\Scripts\python.exe') @params
          exit $LASTEXITCODE

