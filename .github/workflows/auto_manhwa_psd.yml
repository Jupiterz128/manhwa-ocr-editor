name: Manhwa OCR to Photoshop
on:
  workflow_dispatch:
    inputs:
      input_mode:
        description: 'ประเภทต้นทางใน Google Drive'
        required: true
        type: choice
        options: [mtp, image_folder]
      drive_link:
        description: 'ลิงก์ไฟล์ MTP หรือโฟลเดอร์ภาพ'
        type: string
        required: true
      ocr_lang:
        description: 'ภาษา OCR ของโฟลเดอร์ภาพ'
        type: choice
        default: ko+en
        options: [ko+en, en, zh+en, zh_tw+en]
      translation_drive_link:
        description: 'ลิงก์ไฟล์ TXT ที่แปลแล้ว (เว้นว่างเพื่อใช้ Gemini แปลอัตโนมัติในรอบเดียว)'
        type: string
        default: ''
      auto_translate:
        description: 'แปลภาษาไทยอัตโนมัติด้วย Gemini (google-genai) ในรอบเดียวเมื่อไม่มีไฟล์แปล'
        type: boolean
        default: true
      psd_backend:
        description: 'ตัวส่งออก PSD (photopea ไม่เปิด Adobe Photoshop)'
        type: choice
        default: photopea
        options: [photopea, photoshop]
      font_preset_override:
        description: 'โปรไฟล์ฟอนต์ (auto เลือกการ์ตูนต่อสู้สำหรับ MTP)'
        type: choice
        default: auto
        options: [auto, '1. มังฮวาเกาหลี', '2. การ์ตูนต่อสู้']
      use_smart_stitch:
        description: 'รวมและตัดหน้าเมื่อรับคำแปลกลับ (MTP เปิดอัตโนมัติ)'
        type: boolean
        default: false

permissions: {}
concurrency:
  group: local-rtx4060-runner
  cancel-in-progress: false
  queue: max
jobs:
  convert:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, manhwa-rtx4060]
    steps:
      - name: Update local repository (git pull)
        shell: powershell
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          if (Test-Path "$env:ProgramFiles\Git\cmd") {
            $env:PATH = "$env:ProgramFiles\Git\cmd;$env:PATH"
          }
          $root = $env:MANHWA_APP_HOME
          if (!$root) { $root = 'D:\ManhwaOCR' }
          Set-Location -LiteralPath $root
          git pull --rebase --autostash origin main
          exit $LASTEXITCODE
      - name: Run local pipeline
        shell: powershell
        env:
          MODE: ${{ inputs.input_mode }}
          SOURCE: ${{ inputs.drive_link }}
          TRANSLATION: ${{ inputs.translation_drive_link }}
          AUTO_TRANSLATE: ${{ inputs.auto_translate }}
          PSD_BACKEND: ${{ inputs.psd_backend }}
          PRESET: ${{ inputs.font_preset_override }}
          OCR_LANG: ${{ inputs.ocr_lang }}
          STITCH: ${{ inputs.use_smart_stitch }}
          GH_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          if ($env:GH_GEMINI_API_KEY) { $env:GEMINI_API_KEY = $env:GH_GEMINI_API_KEY }
          $root = $env:MANHWA_APP_HOME
          if (!$root) { $root = 'D:\ManhwaOCR' }
          Set-Location -LiteralPath $root
          $params = @('-X','utf8','cli_pipeline.py','--input-mode',$env:MODE,'--drive-link',$env:SOURCE,'--lang',$env:OCR_LANG,'--smart-stitch',$env:STITCH,'--psd-backend',$env:PSD_BACKEND)
          if ($env:PRESET -ne 'auto') { $params += @('--preset',$env:PRESET) }
          if ($env:TRANSLATION) {
            $params += @('--translation-link',$env:TRANSLATION)
          } elseif ($env:MODE -eq 'image_folder' -and $env:AUTO_TRANSLATE -eq 'true') {
            $params += @('--auto-translate-gemini')
          }
          & (Join-Path $root '.venv\Scripts\python.exe') @params
          exit $LASTEXITCODE

